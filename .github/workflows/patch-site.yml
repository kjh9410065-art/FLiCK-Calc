name: Patch Noviq calculator pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    # 사이트의 모든 계산기 HTML을 한 번에 점검하고 동일한 광고 영역을 적용합니다.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch calculator pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('public')
          skip = {'index.html', 'calculator-list.html', '404.html', 'terms.html', 'privacy.html', 'contact.html'}
          css = '.ad-slot{min-height:90px;margin:18px 0;border:1px dashed var(--border);border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;letter-spacing:.05em}'
          slot = '<div class="ad-slot" aria-label="광고 영역">광고 영역</div>'

          for path in sorted(root.glob('*.html')):
              if path.name in skip:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              # 이전 브랜드/도메인이 남아 있으면 Noviq 기준으로 통일합니다.
              text = text.replace('FLiCK Calc', 'Noviq').replace('FLiCK CALC', 'NOVIQ').replace('FLiCK', 'Noviq')
              text = text.replace('https://flick-calc.carpick.workers.dev/', 'https://noviq.tcflick.com/')

              # 광고 슬롯 스타일은 페이지에 한 번만 넣습니다.
              if '.ad-slot{' not in text:
                  text = text.replace('</style>', css + '</style>', 1)

              # 입력 영역 위/결과 아래에 광고 자리를 통일해서 넣습니다.
              if '<div class="ad-slot"' not in text:
                  marker = '<section class="card">'
                  if marker in text:
                      text = text.replace(marker, slot + '\n' + marker, 1)
                  else:
                      marker = '<main class="wrap">'
                      text = text.replace(marker, marker + '\n' + slot, 1)
                  marker = '</section>'
                  if marker in text:
                      text = text.replace(marker, marker + '\n' + slot, 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')

          PY

      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/*.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'patch: 전체 계산기 광고 영역 및 Noviq 브랜딩 정리'
            git push
          fi

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/patch-site.yml
          git commit -m 'chore: 일괄 패치 작업 파일 정리'
          git push
