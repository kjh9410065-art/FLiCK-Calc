<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>FLiCK Calc - 예금·적금 계산기</title>
<meta name="description" content="예금과 적금의 예상 이자와 만기 금액을 계산합니다.">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:720px;margin:auto;padding:24px 16px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-weight:800;font-size:20px}.theme{border:1px solid #d8deea;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.card{background:#fff;border:1px solid #e2e7f0;border-radius:18px;padding:20px;box-shadow:0 6px 24px #17203310}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.tabs button{padding:12px;border:1px solid #d8deea;background:#fff;border-radius:12px;font-weight:700;cursor:pointer}.tabs button.active{background:#172033;color:#fff;border-color:#172033}.field{margin:14px 0}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #cfd6e3;border-radius:10px;font-size:16px;background:inherit;color:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{margin-top:20px;padding:16px;border-radius:14px;background:#f0f3f8}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #dce2ec}.row:last-child{border-bottom:0;font-weight:800;font-size:18px}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1;padding:12px;border:0;border-radius:10px;cursor:pointer;font-weight:700}.share{background:#172033;color:#fff}.reset{background:#e9edf4;color:#172033}.note{font-size:12px;line-height:1.6;color:#657086;margin-top:16px}
body.dark{background:#10141c;color:#edf1f7}.dark .theme,.dark .card,.dark .tabs button{background:#171d27;color:#edf1f7;border-color:#303949}.dark .tabs button.active{background:#edf1f7;color:#10141c}.dark .field input{border-color:#3a4455}.dark .result{background:#1c2430}.dark .row{border-color:#303949}.dark .reset{background:#303949;color:#edf1f7}.dark .note{color:#9aa6b8}
@media(max-width:520px){main{padding-top:16px}.card{padding:16px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <div class="top"><div class="brand">FLiCK Calc</div><button class="theme" id="themeBtn">🌙</button></div>
  <div class="card">
    <h1 id="title" style="margin:0 0 16px;font-size:24px">예금·적금 계산기</h1>
    <div class="tabs">
      <button class="active" id="depositTab">정기예금</button>
      <button id="savingsTab">적금</button>
    </div>

    <div class="field">
      <label id="amountLabel" for="amount">예치금</label>
      <input id="amount" type="number" min="0" step="10000" value="10000000" inputmode="numeric">
    </div>
    <div class="grid">
      <div class="field">
        <label for="rate">연 이율 (%)</label>
        <input id="rate" type="number" min="0" step="0.01" value="3.00" inputmode="decimal">
      </div>
      <div class="field">
        <label for="months">기간 (개월)</label>
        <input id="months" type="number" min="1" step="1" value="12" inputmode="numeric">
      </div>
    </div>

    <div class="result" aria-live="polite">
      <div class="row"><span>원금</span><strong id="principal">0원</strong></div>
      <div class="row"><span>세전 이자</span><strong id="interest">0원</strong></div>
      <div class="row"><span>이자소득세(14%)</span><strong id="tax">0원</strong></div>
      <div class="row"><span>세후 이자</span><strong id="afterInterest">0원</strong></div>
      <div class="row"><span>만기 예상금액</span><strong id="maturity">0원</strong></div>
    </div>

    <div class="actions">
      <button class="share" id="shareBtn">결과 공유</button>
      <button class="reset" id="resetBtn">초기화</button>
    </div>
    <p class="note">※ 단순 예상 계산입니다. 실제 금융상품의 이자는 가입일·납입일·일수 계산 방식, 우대금리, 상품 조건 등에 따라 달라질 수 있습니다. 이자소득세는 국세청의 그 밖의 이자소득 원천징수세율 14%를 적용했습니다. 지방소득세 등 실제 원천징수액과는 차이가 있을 수 있습니다.</p>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
let mode="deposit";
const money=n=>Math.round(n).toLocaleString("ko-KR")+"원";

// 예금/적금 모드를 전환하고 입력 라벨을 바꿉니다.
function setMode(next){
  mode=next;
  $("depositTab").classList.toggle("active",mode==="deposit");
  $("savingsTab").classList.toggle("active",mode==="savings");
  $("amountLabel").textContent=mode==="deposit"?"예치금":"월 납입액";
  calculate();
}

// 예금은 한 번 넣은 원금에 단순 이자를, 적금은 매월 납입하는 금액에 남은 기간을 반영해 예상 이자를 계산합니다.
function calculate(){
  const amount=Math.max(0,Number($("amount").value)||0);
  const rate=Math.max(0,Number($("rate").value)||0)/100;
  const months=Math.max(1,Math.floor(Number($("months").value)||1));
  let principal,interest;

  if(mode==="deposit"){
    principal=amount;
    interest=principal*rate*months/12;
  }else{
    principal=amount*months;
    // 각 월 납입금이 남아 있는 개월 수를 합산한 단순 예상 방식입니다.
    interest=amount*rate*(months*(months+1)/2)/12;
  }

  // 국세청이 안내하는 일반적인 이자소득 원천징수세율 14%를 적용합니다.
  const tax=interest*0.14;
  const afterInterest=interest-tax;
  $("principal").textContent=money(principal);
  $("interest").textContent=money(interest);
  $("tax").textContent=money(tax);
  $("afterInterest").textContent=money(afterInterest);
  $("maturity").textContent=money(principal+afterInterest);
}

// 현재 계산 조건을 URL로 공유할 수 있게 합니다.
async function share(){
  const params=new URLSearchParams({mode,amount:$('amount').value,rate:$('rate').value,months:$('months').value});
  const url=location.origin+location.pathname+"?"+params.toString();
  if(navigator.share){try{await navigator.share({title:"FLiCK Calc 예금·적금 계산기",url});return}catch(e){}}
  try{await navigator.clipboard.writeText(url);alert("계산기 링크를 복사했습니다.")}catch(e){alert("링크 복사에 실패했습니다.")}
}

// URL로 공유된 계산 조건을 복원합니다.
const q=new URLSearchParams(location.search);
if(q.get("mode")==="savings")setMode("savings");
if(q.has("amount"))$("amount").value=q.get("amount");
if(q.has("rate"))$("rate").value=q.get("rate");
if(q.has("months"))$("months").value=q.get("months");

$("depositTab").onclick=()=>setMode("deposit");
$("savingsTab").onclick=()=>setMode("savings");
["amount","rate","months"].forEach(id=>$(id).addEventListener("input",calculate));
$("shareBtn").onclick=share;
$("resetBtn").onclick=()=>{mode="deposit";setMode("deposit");$("amount").value=10000000;$("rate").value=3;$("months").value=12;calculate()};

// 다크 모드를 저장해 다음 방문에도 유지합니다.
const savedTheme=localStorage.getItem("flick-theme");
if(savedTheme==="dark")document.body.classList.add("dark");
$("themeBtn").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("flick-theme",document.body.classList.contains("dark")?"dark":"light")};
calculate();
</script>
</body>
</html>
