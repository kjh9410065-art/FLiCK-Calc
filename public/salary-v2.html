<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLiCK Calc - 연봉 실수령액 계산기</title>
<style>
:root{--bg:#f5f7fb;--text:#151922;--muted:#667085;--card:#fff;--border:#e4e7ec;--primary:#2563eb;--soft:#f8fafc;--result:#eef4ff}
html.dark{--bg:#0f1115;--text:#f2f4f7;--muted:#98a2b3;--card:#171a21;--border:#2b303a;--primary:#4f8cff;--soft:#11141a;--result:#182846}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{width:min(720px,calc(100% - 20px));margin:auto;padding:20px 0 48px}header{padding:8px 4px 18px}.brand{font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--primary)}h1{margin:8px 0;font-size:32px}.sub{margin:0;color:var(--muted);font-size:14px}.theme{float:right;margin-top:-28px;padding:9px 12px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);font-weight:800}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px}.field{margin-bottom:14px}label{display:block;margin-bottom:7px;font-weight:800;font-size:14px}input{width:100%;min-height:50px;border:1px solid var(--border);border-radius:11px;padding:0 13px;background:var(--soft);color:var(--text);font-size:16px}.quick{display:flex;gap:7px;overflow:auto;margin:-3px 0 14px}.quick button,.tool{min-height:40px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--soft);color:var(--text);font-weight:800;white-space:nowrap}.calc{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-weight:900;font-size:16px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.result{margin-top:18px;padding:20px;border-radius:17px;background:var(--result);text-align:center}.label{color:var(--muted);font-size:13px}.take{font-size:42px;font-weight:950;color:var(--primary);margin:4px 0}.annual{color:var(--muted);font-size:13px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.summary div{padding:11px 6px;border:1px solid var(--border);border-radius:11px;background:var(--soft);text-align:center}.summary small{display:block;color:var(--muted)}.summary strong{display:block;margin-top:4px}.rows{margin-top:16px;border-top:1px solid var(--border)}.row{display:flex;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--border);font-size:14px}.row span{color:var(--muted)}.notice{color:var(--muted);font-size:12px;line-height:1.65}.status{margin-top:8px;color:var(--muted);font-size:12px}@media(max-width:420px){h1{font-size:28px}.card{padding:15px}.take{font-size:34px}}
</style>
</head>
<body><main class="wrap">
<header><div class="brand">FLiCK CALC</div><button class="theme" id="theme">🌙 다크모드</button><h1>연봉 실수령액 계산기</h1><p class="sub">연봉과 공제대상 가족 정보를 입력해 월 예상 실수령액을 확인합니다.</p></header>
<section class="card">
<form id="form">
<div class="field"><label for="salary">연봉</label><input id="salary" type="number" min="0" step="10000" value="40000000"></div>
<div class="quick"><button type="button" data-salary="30000000">3천만원</button><button type="button" data-salary="40000000">4천만원</button><button type="button" data-salary="50000000">5천만원</button><button type="button" data-salary="60000000">6천만원</button><button type="button" data-salary="70000000">7천만원</button></div>
<div class="field"><label for="nontax">월 비과세 금액</label><input id="nontax" type="number" min="0" step="10000" value="200000"></div>
<div class="field"><label for="dependents">공제대상 가족 수</label><input id="dependents" type="number" min="1" max="20" step="1" value="1"></div>
<div class="field"><label for="children">8세 이상 20세 이하 자녀 수</label><input id="children" type="number" min="0" max="20" step="1" value="0"></div>
<button class="calc">실수령액 계산하기</button>
</form>
<div class="tools"><button class="tool" id="share" type="button">🔗 결과 공유</button><button class="tool" id="reset" type="button">↺ 초기화</button></div><div class="status" id="status"></div>
<section class="result"><div class="label">월 예상 실수령액</div><div class="take" id="take">-</div><div class="annual" id="annual">연간 예상 실수령액 -</div></section>
<div class="summary"><div><small>월 급여</small><strong id="gross">-</strong></div><div><small>월 공제액</small><strong id="deduction">-</strong></div><div><small>실수령 비율</small><strong id="ratio">-</strong></div></div>
<div class="rows" id="rows"></div>
<p class="notice">※ 현재 소득세는 간편 예상식입니다. 실제 원천징수는 현행 근로소득 간이세액표를 기준으로 합니다. 2026년 3월 1일부터 8~20세 자녀 공제액은 1명 20,830원, 2명 45,830원, 3명 이상은 45,830원 + 2명 초과 1명당 33,330원입니다. 실제 급여는 비과세 항목과 원천징수 방식 등에 따라 달라질 수 있습니다.</p>
</section></section></main>
<script>
// 숫자를 원화 표시로 변환합니다.
const won=v=>Math.round(v).toLocaleString('ko-KR')+'원';
const $=id=>document.getElementById(id);
// 2026년 3월 1일부터 적용되는 자녀별 간이세액 공제액입니다.
function childAdjustment(n){if(n<=0)return 0;if(n===1)return 20830;if(n===2)return 45830;return 45830+(n-2)*33330}
// 입력값을 안전한 숫자 범위로 제한합니다.
function num(id,min,max){const v=Number($(id).value);return Number.isFinite(v)?Math.max(min,Math.min(max,v)):min}
function calculate(){
  const annual=Math.round(num('salary',0,1000000000));
  const gross=annual/12;
  const nontax=Math.min(num('nontax',0,100000000),gross);
  const taxable=Math.max(0,gross-nontax);
  const dependents=Math.round(num('dependents',1,20));
  const children=Math.round(num('children',0,20));
  // 4대보험은 현재 서비스의 기존 예상 계산 방식을 유지합니다.
  const pensionBase=taxable>0?Math.max(410000,Math.min(taxable,6590000)):0;
  const pension=pensionBase*0.0475;
  const health=taxable*0.03595;
  const care=health*0.1314;
  const employment=taxable*0.009;
  // 공식 간이세액표 전체 데이터 반영 전까지 소득세는 예상식으로 표시합니다.
  const familyFactor=Math.min(0.45,Math.max(0,(dependents-1)*0.035));
  let incomeTax=Math.max(0,(taxable*0.045-50000)*(1-familyFactor));
  incomeTax=Math.min(incomeTax,taxable*0.18);
  incomeTax=Math.max(0,incomeTax-childAdjustment(children));
  const localTax=incomeTax*0.1;
  const total=pension+health+care+employment+incomeTax+localTax;
  const takeHome=Math.max(0,gross-total);
  const ratio=gross>0?takeHome/gross*100:0;
  $('take').textContent=won(takeHome);
  $('annual').textContent='연간 예상 실수령액 '+won(takeHome*12);
  $('gross').textContent=won(gross);$('deduction').textContent=won(total);$('ratio').textContent=ratio.toFixed(1)+'%';
  const rows=[['월 급여',won(gross)],['국민연금','-'+won(pension)],['건강보험','-'+won(health)],['장기요양보험','-'+won(care)],['고용보험','-'+won(employment)],['소득세(간편 예상)','-'+won(incomeTax)],['지방소득세','-'+won(localTax)]];
  $('rows').innerHTML=rows.map(([a,b])=>`<div class="row"><span>${a}</span><strong>${b}</strong></div>`).join('');
  syncUrl();$('status').textContent='입력값을 기준으로 계산했습니다.';
}
// 현재 입력값을 URL에 저장해 공유할 수 있게 합니다.
function syncUrl(){history.replaceState(null,'','?'+new URLSearchParams({salary:$('salary').value,nontax:$('nontax').value,dependents:$('dependents').value,children:$('children').value}))}
// 공유 URL이 있으면 입력값을 복원합니다.
const params=new URLSearchParams(location.search);['salary','nontax','dependents','children'].forEach(id=>{if(params.has(id))$(id).value=params.get(id)});
$('form').onsubmit=e=>{e.preventDefault();calculate()};
['salary','nontax','dependents','children'].forEach(id=>$(id).addEventListener('input',calculate));
document.querySelectorAll('[data-salary]').forEach(b=>b.onclick=()=>{$('salary').value=b.dataset.salary;calculate()});
$('reset').onclick=()=>{location.href=location.pathname};
$('share').onclick=async()=>{syncUrl();const url=location.href;try{if(navigator.share)await navigator.share({title:'FLiCK Calc 연봉 실수령액',url});else await navigator.clipboard.writeText(url);$('status').textContent='공유 링크를 준비했습니다.'}catch(e){$('status').textContent='공유를 취소했습니다.'}};
// 다크모드 설정을 저장합니다.
const root=document.documentElement;const saved=localStorage.getItem('flick-theme');if(saved==='dark'||(!saved&&matchMedia('(prefers-color-scheme: dark)').matches))root.classList.add('dark');function themeText(){$('theme').textContent=root.classList.contains('dark')?'☀️ 라이트모드':'🌙 다크모드'}$('theme').onclick=()=>{root.classList.toggle('dark');localStorage.setItem('flick-theme',root.classList.contains('dark')?'dark':'light');themeText()};themeText();calculate();
</script>
</body></html>
