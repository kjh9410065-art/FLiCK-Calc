<style>
:root{color-scheme:light;--bg:#f5f7fb;--text:#151922;--muted:#667085;--card:#fff;--border:#e4e7ec;--primary:#2563eb}html.dark{color-scheme:dark;--bg:#0f1115;--text:#f2f4f7;--muted:#98a2b3;--card:#171a21;--border:#2b303a;--primary:#4f8cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{width:min(720px,calc(100% - 24px));margin:auto;padding:28px 0 48px}.tools{display:flex;justify-content:flex-end}.theme,.filter{border:2px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);padding:9px 13px;font-weight:800;cursor:pointer}.brand{margin-top:18px;font-size:14px;font-weight:900;letter-spacing:.12em;color:var(--primary)}h1{margin:10px 0 7px;font-size:clamp(30px,8vw,42px)}.sub{margin:0 0 16px;color:var(--muted);font-size:14px}.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;padding:10px 15px;font-size:13px}.filter.active{background:var(--primary);border-color:var(--primary);color:#fff}.count{margin:0 0 12px;color:var(--muted);font-size:12px}.grid{display:grid;gap:12px}.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:19px;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-2px);border-color:var(--primary)}.category{font-size:11px;font-weight:900;color:var(--primary);letter-spacing:.05em}.title{margin-top:6px;font-size:19px;font-weight:900}.desc{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.5}.arrow{margin-top:13px;font-size:13px;font-weight:800;color:var(--primary)}.empty{text-align:center;padding:32px 16px;color:var(--muted);border:1px dashed var(--border);border-radius:18px;display:none}.empty.show{display:block}.footer{margin-top:28px;padding-top:18px;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:12px}.footer a{color:inherit;text-decoration:none;margin:0 7px}.footer a:hover{color:var(--primary)}.email{display:inline-block;margin-top:10px;color:var(--muted);text-decoration:none}.email:hover{color:var(--primary)}
</style></head>
<body><main class="wrap"><div class="tools"><button class="theme" id="theme" type="button">🌙 다크모드</button></div><div class="brand">FLiCK CALC</div><h1>계산기 모음</h1><p class="sub">원하는 계산기를 카테고리로 빠르게 찾아보세요.</p><div class="filters" id="filters" role="group" aria-label="계산기 카테고리"></div><p class="count" id="count" aria-live="polite">계산기를 불러오는 중...</p><section class="grid" id="grid" aria-label="계산기 목록"></section><div class="empty" id="empty">계산기를 불러오지 못했습니다.</div><footer class="footer"><div><a href="/terms.html">이용약관</a><a href="/privacy.html">개인정보처리방침</a><a href="/contact.html">문의하기</a></div><a class="email" href="mailto:kjh9410065@gmail.com">kjh9410065@gmail.com</a><div style="margin-top:10px">© 2026 FLiCK Calc. All rights reserved.</div></footer></main>
<script>
const root=document.documentElement,theme=document.getElementById('theme');
// 저장된 테마가 있으면 유지하고, 없으면 기기 다크모드를 따릅니다.
const saved=localStorage.getItem('flick-theme');if(saved==='dark'||(!saved&&matchMedia('(prefers-color-scheme: dark)').matches))root.classList.add('dark');
function updateTheme(){theme.textContent=root.classList.contains('dark')?'☀️ 라이트모드':'🌙 다크모드'}theme.addEventListener('click',()=>{const dark=root.classList.toggle('dark');localStorage.setItem('flick-theme',dark?'dark':'light');updateTheme()});updateTheme();
const filters=document.getElementById('filters'),grid=document.getElementById('grid'),count=document.getElementById('count'),empty=document.getElementById('empty');let cards=[],active='전체';
// 중앙 등록 파일을 읽어 홈페이지 카드와 카테고리를 자동으로 구성합니다.
async function load(){try{const response=await fetch('/calculators.json',{cache:'no-store'});if(!response.ok)throw new Error('registry');const data=await response.json();cards=data.calculators.filter(item=>item.status==='active');renderFilters();render();}catch(error){count.textContent='계산기 목록을 불러오지 못했습니다.';empty.classList.add('show')}}
function renderFilters(){filters.innerHTML='';const categories=['전체',...new Set(cards.map(item=>item.category))];categories.forEach(category=>{const button=document.createElement('button');button.className='filter'+(category===active?' active':'');button.type='button';button.textContent=category;button.addEventListener('click',()=>{active=category;renderFilters();render()});filters.appendChild(button)})}
function render(){grid.innerHTML='';const visible=cards.filter(item=>active==='전체'||item.category===active);visible.forEach(item=>{const link=document.createElement('a');link.className='card';link.href=item.url;link.innerHTML=`<div class="category">${item.category}</div><div class="title">${item.name}</div><div class="desc">${item.description}</div><div class="arrow">${item.name} →</div>`;grid.appendChild(link)});count.textContent=`전체 ${cards.length}개 중 ${visible.length}개 표시`;empty.classList.toggle('show',visible.length===0)}
load();
</script></body></html>
