<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb">
<title>FLiCK Calc - 연차수당 계산기</title><meta name="description" content="월 통상임금과 미사용 연차를 입력해 예상 연차수당을 계산합니다.">
<style>
:root{color-scheme:light;--bg:#f5f7fb;--text:#151922;--muted:#667085;--card:#fff;--border:#e4e7ec;--input:#fff;--primary:#2563eb;--soft:#f8fafc;--result:#eef4ff}html.dark{color-scheme:dark;--bg:#0f1115;--text:#f2f4f7;--muted:#98a2b3;--card:#171a21;--border:#2b303a;--input:#11141a;--primary:#4f8cff;--soft:#11141a;--result:#182846}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{width:min(720px,calc(100% - 24px));margin:auto;padding:24px 0 48px}header{padding:8px 4px 20px;position:relative}.brand{font-size:14px;font-weight:900;letter-spacing:.12em;color:var(--primary)}h1{margin:8px 0 6px;font-size:clamp(27px,7vw,40px)}.sub{margin:0;color:var(--muted);font-size:14px}.theme{position:absolute;right:0;top:0;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);padding:10px 13px;font-weight:800;cursor:pointer}.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(16,24,40,.06)}.field{margin-bottom:15px}label{display:block;margin-bottom:7px;font-size:14px;font-weight:800}.input-row{display:flex;gap:8px;align-items:center}input{width:100%;min-height:50px;border:1px solid var(--border);border-radius:12px;padding:0 14px;font-size:16px;background:var(--input);color:var(--text)}.unit{color:var(--muted);white-space:nowrap}.calc{width:100%;min-height:54px;border:0;border-radius:13px;background:var(--primary);color:#fff;font-size:16px;font-weight:900;cursor:pointer}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.tool{min-height:44px;border:1px solid var(--border);border-radius:11px;background:var(--soft);color:var(--text);font-weight:800;cursor:pointer}.result{margin-top:18px;padding:22px;border-radius:18px;background:var(--result);text-align:center}.label{font-size:14px;color:var(--muted)}.amount{margin-top:5px;font-size:clamp(31px,9vw,48px);font-weight:950;color:var(--primary)}.details{margin-top:18px;border-top:1px solid var(--border)}.row{display:flex;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--border);font-size:14px}.row span{color:var(--muted)}.notice{font-size:12px;line-height:1.65;color:var(--muted);margin:16px 2px 0}@media(max-width:420px){.wrap{width:calc(100% - 18px);padding-top:16px}.card{padding:16px}.theme{position:relative;right:auto;top:auto;margin-top:14px}}
</style></head>
<body><main class="wrap"><header><div class="brand">FLiCK CALC</div><button class="theme" id="theme" type="button">🌙 다크모드</button><h1>연차수당 계산기</h1><p class="sub">월 통상임금과 미사용 연차를 입력해 예상 금액을 확인하세요.</p></header>
<section class="card"><form id="form" autocomplete="off">
<div class="field"><label for="wage">월 통상임금</label><div class="input-row"><input id="wage" type="number" inputmode="numeric" min="0" step="10000" value="3000000" required><span class="unit">원</span></div></div>
<div class="field"><label for="hours">월 통상임금 산정 기준시간</label><div class="input-row"><input id="hours" type="number" inputmode="decimal" min="1" step="1" value="209" required><span class="unit">시간</span></div></div>
<div class="field"><label for="days">미사용 연차</label><div class="input-row"><input id="days" type="number" inputmode="decimal" min="0" step="0.5" value="10" required><span class="unit">일</span></div></div>
<button class="calc" type="submit">연차수당 계산하기</button></form>
<div class="tools"><button class="tool" id="share" type="button">🔗 결과 공유</button><button class="tool" id="reset" type="button">↺ 초기화</button></div>
<section class="result"><div class="label">예상 연차수당</div><div class="amount" id="result">-</div></section><div class="details" id="details"></div>
<p class="notice">※ 간편 예상 계산입니다. 고용노동부 안내에 따라 별도 규정이 없으면 연차수당은 통상임금을 기준으로 계산하며, 실제 금액은 근로시간·취업규칙·통상임금 해당 항목 등에 따라 달라질 수 있습니다.</p></section></main>
<script>
// 금액을 원화 형식으로 표시합니다.
const won=v=>Math.round(v).toLocaleString('ko-KR')+'원';const root=document.documentElement,theme=document.getElementById('theme');
// 사용자의 다크모드 설정을 저장하고 복원합니다.
const saved=localStorage.getItem('flick-theme');if(saved==='dark'||(!saved&&matchMedia('(prefers-color-scheme: dark)').matches))root.classList.add('dark');function updateTheme(){theme.textContent=root.classList.contains('dark')?'☀️ 라이트모드':'🌙 다크모드'}theme.onclick=()=>{const dark=root.classList.toggle('dark');localStorage.setItem('flick-theme',dark?'dark':'light');updateTheme()};updateTheme();
// 입력값을 이용해 통상시급과 1일 연차수당을 계산합니다.
function calculate(){const wage=Math.max(0,Number(document.getElementById('wage').value)||0),hours=Math.max(1,Number(document.getElementById('hours').value)||209),days=Math.max(0,Number(document.getElementById('days').value)||0);const hourly=wage/hours,daily=hourly*8,total=daily*days;document.getElementById('result').textContent=won(total);document.getElementById('details').innerHTML=`<div class="row"><span>통상시급</span><strong>${won(hourly)}</strong></div><div class="row"><span>1일 연차수당(8시간 기준)</span><strong>${won(daily)}</strong></div><div class="row"><span>미사용 연차</span><strong>${days}일</strong></div>`}
document.getElementById('form').onsubmit=e=>{e.preventDefault();calculate()};['wage','hours','days'].forEach(id=>document.getElementById(id).addEventListener('input',calculate));
// 현재 입력값을 URL에 저장해 결과를 공유할 수 있게 합니다.
document.getElementById('share').onclick=async()=>{const p=new URLSearchParams({wage:document.getElementById('wage').value,hours:document.getElementById('hours').value,days:document.getElementById('days').value});history.replaceState(null,'','?'+p);const url=location.href;try{if(navigator.share)await navigator.share({title:'FLiCK Calc - 연차수당 계산기',url});else await navigator.clipboard.writeText(url)}catch(e){}};
// 기본값으로 되돌립니다.
document.getElementById('reset').onclick=()=>{document.getElementById('wage').value=3000000;document.getElementById('hours').value=209;document.getElementById('days').value=10;calculate()};
// 공유 링크로 들어왔으면 저장된 입력값을 복원합니다.
const p=new URLSearchParams(location.search);['wage','hours','days'].forEach(id=>{if(p.has(id))document.getElementById(id).value=p.get(id)});calculate();
</script></body></html>
