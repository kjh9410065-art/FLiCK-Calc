<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLiCK Calc - 연봉 실수령액 계산기</title>
  <meta name="description" content="연봉과 비과세 금액을 입력해 월 예상 실수령액을 계산하는 FLiCK 계산기입니다.">
  <style>
    /* 전체 화면의 기본 글꼴과 배경을 설정합니다. */
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; background: #f5f7fb; color: #17191c; }
    .wrap { width: min(720px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 50px; }
    header { margin-bottom: 18px; }
    .brand { font-size: 14px; font-weight: 800; letter-spacing: .08em; color: #2563eb; }
    h1 { margin: 8px 0 6px; font-size: clamp(26px, 6vw, 38px); line-height: 1.15; }
    .sub { margin: 0; color: #68707c; font-size: 14px; }
    .card { background: #fff; border: 1px solid #e3e7ee; border-radius: 20px; padding: 20px; box-shadow: 0 8px 28px rgba(20,30,50,.06); }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; }
    .input-row { display: flex; align-items: center; gap: 8px; }
    input { width: 100%; min-height: 48px; border: 1px solid #d8dde6; border-radius: 12px; padding: 0 14px; font-size: 16px; outline: none; }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .unit { color: #69717d; white-space: nowrap; font-size: 14px; }
    button { width: 100%; min-height: 52px; border: 0; border-radius: 13px; background: #2563eb; color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; }
    button:active { transform: translateY(1px); }
    .result { margin-top: 18px; padding: 20px; border-radius: 18px; background: #f0f5ff; text-align: center; }
    .result-label { color: #596575; font-size: 14px; }
    .take-home { margin-top: 5px; font-size: clamp(30px, 8vw, 46px); font-weight: 900; color: #1749b5; }
    .annual { margin-top: 5px; color: #596575; font-size: 14px; }
    .details { margin-top: 18px; border-top: 1px solid #edf0f4; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid #edf0f4; font-size: 14px; }
    .row span:first-child { color: #596575; }
    .row strong { text-align: right; }
    .notice { margin-top: 16px; color: #737b87; font-size: 12px; line-height: 1.6; }
    @media (max-width: 420px) { .wrap { width: min(100% - 20px, 720px); padding-top: 20px; } .card { padding: 16px; border-radius: 16px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand">FLiCK CALC</div>
      <h1>연봉 실수령액 계산기</h1>
      <p class="sub">연봉을 입력하면 월 예상 실수령액을 계산합니다.</p>
    </header>

    <section class="card">
      <form id="calcForm">
        <div class="field">
          <label for="salary">연봉</label>
          <div class="input-row"><input id="salary" type="number" min="0" step="10000" value="40000000" required><span class="unit">원</span></div>
        </div>
        <div class="field">
          <label for="nontax">월 비과세 금액</label>
          <div class="input-row"><input id="nontax" type="number" min="0" step="10000" value="200000"><span class="unit">원</span></div>
        </div>
        <div class="field">
          <label for="dependents">부양가족 수</label>
          <div class="input-row"><input id="dependents" type="number" min="1" max="20" step="1" value="1"><span class="unit">명</span></div>
        </div>
        <div class="field">
          <label for="children">20세 이하 자녀 수</label>
          <div class="input-row"><input id="children" type="number" min="0" max="20" step="1" value="0"><span class="unit">명</span></div>
        </div>
        <button type="submit">실수령액 계산하기</button>
      </form>

      <section class="result" aria-live="polite">
        <div class="result-label">월 예상 실수령액</div>
        <div class="take-home" id="monthlyResult">-</div>
        <div class="annual" id="annualResult">연간 예상 실수령액 -</div>
      </section>

      <div class="details" id="details"></div>
      <p class="notice">※ 현재 버전은 빠른 예상용입니다. 실제 급여명세서와는 비과세 항목, 부양가족, 소득공제 및 원천징수 조건 등에 따라 차이가 날 수 있습니다.</p>
    </section>
  </main>

  <script>
    // 숫자를 원화 표시 형식으로 바꿉니다.
    const won = (value) => Math.round(value).toLocaleString('ko-KR') + '원';

    // 2026년 계산기의 기본 보험료율을 적용합니다.
    // 소득세는 정확한 국세청 간이세액표를 별도 데이터로 넣기 전까지 간편 예상 방식으로 계산합니다.
    function calculate() {
      const annualSalary = Math.max(0, Number(document.getElementById('salary').value) || 0);
      const monthlyNontax = Math.max(0, Number(document.getElementById('nontax').value) || 0);
      const dependents = Math.max(1, Math.min(20, Number(document.getElementById('dependents').value) || 1));
      const children = Math.max(0, Math.min(20, Number(document.getElementById('children').value) || 0));

      const monthlyGross = annualSalary / 12;
      const taxableMonthly = Math.max(0, monthlyGross - monthlyNontax);

      // 근로자 부담분: 국민연금 4.75%, 건강보험 3.595%, 고용보험 0.9%.
      const pension = Math.min(taxableMonthly, 6370000) * 0.0475;
      const health = taxableMonthly * 0.03595;
      const longTermCare = health * 0.1314;
      const employment = taxableMonthly * 0.009;

      // 소득세는 정확한 원천징수표를 넣기 전의 보수적인 간편 추정치입니다.
      // 부양가족/자녀가 많을수록 예상 소득세를 낮춥니다.
      const familyRelief = Math.min(0.45, Math.max(0, (dependents - 1) * 0.035 + children * 0.02));
      let incomeTax = Math.max(0, (taxableMonthly * 0.045 - 50000) * (1 - familyRelief));
      incomeTax = Math.min(incomeTax, taxableMonthly * 0.18);
      const localTax = incomeTax * 0.1;

      const totalDeduction = pension + health + longTermCare + employment + incomeTax + localTax;
      const monthlyTakeHome = Math.max(0, monthlyGross - totalDeduction);

      document.getElementById('monthlyResult').textContent = won(monthlyTakeHome);
      document.getElementById('annualResult').textContent = '연간 예상 실수령액 ' + won(monthlyTakeHome * 12);

      const rows = [
        ['월 급여', won(monthlyGross)],
        ['국민연금', '-' + won(pension)],
        ['건강보험', '-' + won(health)],
        ['장기요양보험', '-' + won(longTermCare)],
        ['고용보험', '-' + won(employment)],
        ['소득세(간편 예상)', '-' + won(incomeTax)],
        ['지방소득세', '-' + won(localTax)]
      ];
      document.getElementById('details').innerHTML = rows.map(([label, value]) => `<div class="row"><span>${label}</span><strong>${value}</strong></div>`).join('');
    }

    // 폼을 제출하면 페이지를 새로고침하지 않고 바로 결과를 계산합니다.
    document.getElementById('calcForm').addEventListener('submit', (event) => {
      event.preventDefault();
      calculate();
    });

    // 처음 접속했을 때 기본값으로 계산 결과를 바로 보여줍니다.
    calculate();
  </script>
</body>
</html>
